app = "petclassifier"  # cambia esto con el nombre que usaste al hacer `fly launch`
primary_region = "bog"    # o usa "mia", "scl", etc. según cercanía

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
